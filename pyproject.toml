[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstats"
version = "0.1.0"
description = "A streaming analyzer for CSV and JSONL event files"
requires-python = ">=3.10"
[project.scripts]
streamstats = "streamstats.__main__:main"

[project.optional-dependencies]
dev = [
"pytest",
"ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
